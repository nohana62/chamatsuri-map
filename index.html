<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>金谷 お茶まつりマップ</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;font-family:sans-serif;}
  #app{display:flex;flex-direction:column;height:100%;}
  header{
    background:#2f4a37;color:#f4efe2;padding:10px 14px;
    display:flex;align-items:center;gap:10px;flex-shrink:0;
  }
  header h1{font-size:16px;}
  #map{flex:1;}
</style>
</head>
<body>
<div id="app">
  <header>
    <span style="font-size:22px;">🍵</span>
    <h1>金谷 お茶まつり マップ</h1>
  </header>
  <div id="map"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  const VIEW_BOUNDS = [[34.8190, 138.1244], [34.8276, 138.1355]];
  const map = L.map('map', { zoomControl:true }).fitBounds(VIEW_BOUNDS);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom:19,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);
</script>
</body>
</html>
