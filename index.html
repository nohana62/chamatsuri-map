<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>金谷 お茶まつりマップ</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --tea-deep:#2f4a37; --tea-mid:#4f7057; --tea-pale:#e8e3d0;
    --washi:#f4efe2; --indigo:#28384d; --hoji:#7a5230;
    --vermilion:#b8452e; --ink:#232821; --line:rgba(35,40,33,0.14);
    --radius:14px; --shadow:0 6px 20px rgba(35,40,33,0.18);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;font-family:"Noto Sans JP",sans-serif;color:var(--ink);background:var(--washi);}
  #app{display:flex;flex-direction:column;height:100%;position:fixed;inset:0;}
  header{
    background:linear-gradient(135deg,var(--tea-deep),var(--tea-mid));
    color:var(--washi);padding:10px 14px;
    display:flex;align-items:center;gap:10px;flex-shrink:0;
    box-shadow:var(--shadow);z-index:1000;
  }
  .mark{
    width:32px;height:32px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#eaf2e5,var(--tea-pale) 60%,var(--tea-mid));
    display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,0.5);
  }
  header h1{font-family:"Shippori Mincho",serif;font-weight:700;font-size:15px;line-height:1.3;white-space:nowrap;}
  header .sub{font-size:9px;opacity:.85;letter-spacing:.05em;white-space:nowrap;}
  .spacer{flex:1;}
  #adminBtn{
    background:rgba(255,255,255,0.14);color:var(--washi);border:1px solid rgba(255,255,255,0.4);
    padding:7px 12px;border-radius:20px;font-size:12px;cursor:pointer;font-weight:500;white-space:nowrap;flex-shrink:0;
  }
  #adminBtn.on{background:var(--vermilion);border-color:var(--vermilion);}
  #main{flex:1;display:-webkit-flex;display:flex;min-height:0;position:relative;}
  #map{flex:1;min-width:0;position:relative;}
  #panel{
    width:320px;max-width:88vw;background:var(--washi);border-left:1px solid var(--line);
    display:flex;flex-direction:column;box-shadow:-4px 0 16px rgba(0,0,0,0.06);z-index:900;
  }
  #tabs{display:flex;border-bottom:1px solid var(--line);flex-shrink:0;}
  .tab{
    flex:1;padding:11px 4px;text-align:center;font-size:12px;font-weight:700;cursor:pointer;
    color:var(--tea-deep);opacity:.55;border-bottom:3px solid transparent;
  }
  .tab.active{opacity:1;border-bottom-color:var(--vermilion);}
  #tabContent{flex:1;overflow-y:auto;padding:12px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:11px 12px;margin-bottom:10px;}
  .card:active{background:var(--tea-pale);}
  .card.dragging{opacity:.4;background:var(--tea-pale);}
  .card.drag-over{border-color:var(--vermilion);border-style:dashed;}
  .drag-handle{font-size:18px;cursor:grab;padding:0 6px 0 0;color:#aaa;-webkit-user-select:none;user-select:none;touch-action:none;}
  .sort-hint{font-size:11px;color:#aaa;text-align:center;margin-bottom:6px;}
  .card h3{margin:0 0 4px;font-size:14px;font-family:"Shippori Mincho",serif;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;gap:4px;}
  .card .meta{font-size:11px;color:#666;margin-top:2px;}
  .card .crow{display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between;-webkit-align-items:center;align-items:center;gap:6px;-webkit-flex-wrap:wrap;flex-wrap:wrap;}
  .toilet-counts{font-size:12px;color:var(--ink);margin-top:6px;display:-webkit-flex;display:flex;gap:14px;-webkit-flex-wrap:wrap;flex-wrap:wrap;}
  .live-badge{display:-webkit-inline-flex;display:inline-flex;-webkit-align-items:center;align-items:center;gap:4px;font-size:10px;color:var(--vermilion);font-weight:700;}
  .live-dot{width:6px;height:6px;border-radius:50%;background:var(--vermilion);animation:pulse 1.4s infinite;}
  @keyframes pulse{0%{opacity:1;}50%{opacity:.25;}100%{opacity:1;}}
  .sched{list-style:none;margin:6px 0 0;padding:0;}
  .sched-day{margin-top:6px;}
  .sched-day .day-h{font-size:11px;font-weight:700;color:#fff;background:var(--tea-mid);display:inline-block;padding:2px 9px;border-radius:10px;margin-bottom:3px;}
  .sched li{padding:5px 0 5px 2px;font-size:12px;display:-webkit-flex;display:flex;gap:8px;border-bottom:1px dashed var(--line);}
  .sched li .t{font-weight:700;color:var(--indigo);min-width:44px;}
  .btn{border:none;border-radius:8px;padding:6px 10px;font-size:11px;cursor:pointer;font-weight:600;}
  .btn-primary{background:var(--tea-deep);color:#fff;}
  .btn-outline{background:transparent;color:var(--tea-deep);border:1px solid var(--tea-deep);}
  .btn-danger{background:transparent;color:var(--vermilion);border:1px solid var(--vermilion);}
  .btn-live{background:var(--vermilion);color:#fff;}
  #emptyState{font-size:12px;color:#777;text-align:center;padding:26px 10px;line-height:1.7;}
  .hint{font-size:11px;color:var(--tea-deep);background:var(--tea-pale);border-radius:8px;padding:8px 10px;margin-bottom:10px;line-height:1.6;}
  .schedDayGroup{border:1px solid var(--line);border-radius:10px;padding:8px 8px 4px;margin-bottom:10px;background:#faf8f2;}
  .schedDayGroup .dayLabel{font-size:11px;font-weight:700;color:var(--tea-deep);margin-bottom:6px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;gap:6px;}
  .schedDayGroup .dayLabel input[type="date"]{-webkit-flex:1;flex:1;padding:4px 6px;border:1px solid var(--line);border-radius:6px;font-size:12px;}
  .schedRow{display:-webkit-flex;display:flex;gap:6px;margin-bottom:6px;-webkit-align-items:center;align-items:center;}
  .schedRow input[type="time"]{-webkit-flex:0 0 90px;flex:0 0 90px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;font-size:12px;}
  .schedRow input[type="text"]{-webkit-flex:1;flex:1;padding:4px 6px;border:1px solid var(--line);border-radius:6px;font-size:12px;font-family:inherit;}
  .placeHint{
    position:absolute;top:10px;left:50%;-webkit-transform:translateX(-50%);transform:translateX(-50%);z-index:950;
    background:var(--vermilion);color:#fff;padding:8px 16px;border-radius:20px;
    font-size:12px;font-weight:700;box-shadow:var(--shadow);display:none;white-space:nowrap;pointer-events:none;
  }
  #loginOverlay,#addOverlay{
    position:fixed;inset:0;background:rgba(35,40,33,0.55);z-index:2000;display:none;
    -webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;padding:20px;
  }
  .modal-box{background:#fff;border-radius:16px;padding:22px;width:300px;box-shadow:var(--shadow);max-height:86vh;overflow-y:auto;}
  .modal-box h2{font-family:"Shippori Mincho",serif;font-size:16px;margin:0 0 8px;}
  .modal-box p{font-size:12px;color:#666;margin:0 0 12px;}
  .modal-inp{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;margin-bottom:8px;font-family:inherit;}
  .modal-box label{font-size:11px;font-weight:700;color:var(--tea-deep);display:block;margin-bottom:3px;}
  .modal-row{display:-webkit-flex;display:flex;gap:8px;-webkit-justify-content:flex-end;justify-content:flex-end;margin-top:8px;}
  .count-row{display:-webkit-flex;display:flex;gap:10px;margin-bottom:8px;}
  .count-row > div{-webkit-flex:1;flex:1;}
  .icon-sel-wrap{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
  .icon-sel-btn{background:#f4f4f4;border:2px solid transparent;border-radius:10px;padding:4px;cursor:pointer;text-align:center;-webkit-transition:border-color .15s;transition:border-color .15s;}
  .icon-sel-btn:active,.icon-sel-btn.selected{border-color:var(--vermilion);background:var(--tea-pale);}
  .pin-img{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;}
  .marker-live-badge{
    background:var(--vermilion);color:#fff;font-size:9px;font-weight:700;
    padding:1px 5px;border-radius:8px;margin-top:2px;
    display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;gap:3px;
    box-shadow:0 1px 4px rgba(0,0,0,0.3);
  }
  #loginErr{color:var(--vermilion);font-size:11px;min-height:14px;margin:-4px 0 8px;}
  .leaflet-div-icon{background:none;border:none;}
  .pin{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;-webkit-transform:translateY(-6px);transform:translateY(-6px);}
  .pin .bubble{width:34px;height:34px;border-radius:50% 50% 50% 0;-webkit-transform:rotate(-45deg);transform:rotate(-45deg);display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;box-shadow:var(--shadow);border:2px solid #fff;}
  .pin .bubble span{-webkit-transform:rotate(45deg);transform:rotate(45deg);font-size:16px;}
  .pin.dashi .bubble{background:var(--vermilion);}
  .pin.toilet .bubble{background:var(--indigo);}
  .pin.venue .bubble{background:var(--hoji);}
  .pin .label{margin-top:2px;background:#fff;border-radius:6px;padding:1px 6px;font-size:10px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,0.18);max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  @media(max-width:720px){
    #panel{position:fixed;right:0;top:58px;bottom:0;z-index:1400;-webkit-transform:translateX(100%);transform:translateX(100%);-webkit-transition:-webkit-transform .25s ease;transition:transform .25s ease;}
    #panel.open{-webkit-transform:translateX(0);transform:translateX(0);}
    #panelToggle{display:-webkit-inline-flex !important;display:inline-flex !important;}
    header h1{font-size:13px;}
    header .sub{font-size:9px;}
  }
  #panelToggle{display:none;background:rgba(255,255,255,0.14);color:var(--washi);border:1px solid rgba(255,255,255,0.4);padding:7px 10px;border-radius:20px;font-size:12px;cursor:pointer;}
  #toast{position:fixed;bottom:24px;left:50%;-webkit-transform:translateX(-50%);transform:translateX(-50%);background:#333;color:#fff;padding:8px 18px;border-radius:20px;font-size:12px;opacity:0;-webkit-transition:opacity .3s;transition:opacity .3s;pointer-events:none;z-index:3000;white-space:nowrap;}
  #toast.show{opacity:1;}
  #itemPopup{
    position:fixed;bottom:0;left:0;right:0;z-index:1500;display:none;
    -webkit-align-items:flex-end;align-items:flex-end;-webkit-justify-content:center;justify-content:center;
    background:rgba(35,40,33,0.35);
    padding:0;
  }
  @media(min-width:721px){
    #itemPopup{left:0;right:320px;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;}
  }
  #itemPopupBox{
    background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:480px;
    padding:16px 16px 24px;box-shadow:var(--shadow);max-height:70vh;overflow-y:auto;
  }
  @media(min-width:721px){
    #itemPopupBox{border-radius:16px;max-width:360px;margin:0 auto;}
  }
  #itemPopupHeader{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:space-between;justify-content:space-between;margin-bottom:8px;gap:8px;}
  #itemPopupTitle{font-family:"Shippori Mincho",serif;font-size:16px;font-weight:700;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;}
  #itemPopupClose{background:none;border:none;font-size:18px;cursor:pointer;color:#999;padding:4px 6px;line-height:1;flex-shrink:0;}
  .popup-note{font-size:12px;color:#666;margin-bottom:4px;}
  .popup-live{font-size:12px;color:var(--vermilion);font-weight:700;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;gap:5px;margin-top:4px;}
  /* LeafletポップアップのPC向けカスタムスタイル */
  .chamatsuri-popup .leaflet-popup-content-wrapper{
    border-radius:12px;box-shadow:var(--shadow);padding:0;overflow:hidden;font-family:"Noto Sans JP",sans-serif;
  }
  .chamatsuri-popup .leaflet-popup-content{margin:0;width:auto !important;}
  .chamatsuri-popup .leaflet-popup-tip-container{margin-top:-1px;}
  .lp-title{
    font-family:"Shippori Mincho",serif;font-size:15px;font-weight:700;
    display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;
    padding:10px 12px 8px;border-bottom:1px solid var(--line);background:var(--washi);
  }
  .lp-body{padding:10px 12px 12px;font-size:12px;min-width:200px;max-width:280px;}
  #locateBtn{
    position:absolute;bottom:30px;right:12px;z-index:1000;
    width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;
    background:#fff;box-shadow:0 2px 8px rgba(0,0,0,0.25);
    display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;
    font-size:22px;-webkit-transition:background .15s;transition:background .15s;
  }
  #locateBtn:active{background:var(--tea-pale);}
  #locateBtn.locating{animation:pulse 1s infinite;}</style>
</head>
<body>
<div id="app">
  <header>
    <div class="mark">&#x1F375;</div>
    <div style="min-width:0;overflow:hidden;">
      <h1>お茶まつりマップ</h1>
      <div class="sub">金谷 CHAMATSURI LIVE MAP</div>
      <div id="liveStatus" style="display:none;-webkit-align-items:center;align-items:center;font-size:10px;font-weight:700;color:#ffcc66;margin-top:2px;letter-spacing:.03em;"></div>
    </div>
    <div class="spacer"></div>
    <button id="panelToggle" onclick="togglePanel()">&#x4E00;&#x89A7; &#x25BE;</button>
    <button id="adminBtn" onclick="onAdminBtn()">&#x7BA1;&#x7406;&#x8005;&#x30ED;&#x30B0;&#x30A4;&#x30F3;</button>
  </header>
  <div id="main">
    <div id="map">
      <button id="locateBtn" onclick="locateMe()" title="現在地へ移動">📍</button>
    </div>
    <div class="placeHint" id="placeHint"></div>
    <div id="panel">
      <div id="tabs">
        <div class="tab active" data-tab="dashi" onclick="switchTab('dashi')">&#x1F3EE; &#x5C71;&#x8ECA;</div>
        <div class="tab" data-tab="toilet" onclick="switchTab('toilet')">&#x1F6BB; &#x30C8;&#x30A4;&#x30EC;</div>
        <div class="tab" data-tab="venue" onclick="switchTab('venue')">&#x1F3AA; &#x30A4;&#x30D9;&#x30F3;&#x30C8;</div>
      </div>
      <div id="tabContent"></div>
    </div>
  </div>
</div>

<div id="loginOverlay">
  <div class="modal-box">
    <h2>&#x7BA1;&#x7406;&#x8005;&#x30ED;&#x30B0;&#x30A4;&#x30F3;</h2>
    <p>&#x5C71;&#x8ECA;&#x30FB;&#x30C8;&#x30A4;&#x30EC;&#x30FB;&#x4F1A;&#x5834;&#x306E;&#x767B;&#x9332;&#x306F;&#x7BA1;&#x7406;&#x8005;&#x306E;&#x307F;&#x884C;&#x3048;&#x307E;&#x3059;&#x3002;&#x5408;&#x8A00;&#x8449;&#x3092;&#x5165;&#x529B;&#x3057;&#x3066;&#x304F;&#x3060;&#x3055;&#x3044;&#x3002;</p>
    <input type="password" id="loginPin" class="modal-inp" placeholder="&#x5408;&#x8A00;&#x8449;" autocomplete="off">
    <div id="loginErr"></div>
    <div class="modal-row">
      <button class="btn btn-outline" onclick="closeLogin()">&#x30AD;&#x30E3;&#x30F3;&#x30BB;&#x30EB;</button>
      <button class="btn btn-primary" onclick="tryLogin()">&#x30ED;&#x30B0;&#x30A4;&#x30F3;</button>
    </div>
  </div>
</div>

<div id="addOverlay">
  <div class="modal-box">
    <h2 id="addOverlayTitle">&#x767B;&#x9332;</h2>
    <div id="addOverlayBody"></div>
    <div class="modal-row">
      <button class="btn btn-outline" onclick="cancelAddForm()">&#x30AD;&#x30E3;&#x30F3;&#x30BB;&#x30EB;</button>
      <button class="btn btn-primary" id="addOverlaySubmit">&#x3053;&#x306E;&#x5185;&#x5BB9;&#x3067;&#x767B;&#x9332;</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<div id="itemPopup">
  <div id="itemPopupBox">
    <div id="itemPopupHeader">
      <div id="itemPopupTitle"></div>
      <button onclick="closeItemPopup()" id="itemPopupClose">&#x2715;</button>
    </div>
    <div id="itemPopupBody"></div>
  </div>
</div>

<!-- Leaflet を先に読み込む -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<!-- Firebase SDK (ESM CDN) -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, set, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* ---- Firebase 初期化 ---- */
const firebaseConfig = {
  apiKey: "AIzaSyAe2xRNccV-_onpOe0hODkzJ92jpwkePHk",
  authDomain: "chamatsuri-map.firebaseapp.com",
  databaseURL: "https://chamatsuri-map-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "chamatsuri-map",
  storageBucket: "chamatsuri-map.firebasestorage.app",
  messagingSenderId: "872902806032",
  appId: "1:872902806032:web:1f0ef1a869f6ce67de1895"
};
const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);

/* ---- 設定 ---- */
const ADMIN_PASSCODE = "kanaya";
const CENTER = [34.8233, 138.1300];
const VIEW_BOUNDS = [[34.8190, 138.1244], [34.8276, 138.1355]];
const TYPES = ['dashi','toilet','venue'];

let isAdmin = false;
let currentTab = "dashi";
let data = { dashi:{}, toilet:{}, venue:{} };
let markers = { dashi:{}, toilet:{}, venue:{} };
let placingType = null;
let liveWatchId = null;
let liveDashiId = null;
let lastLiveSend = 0;

/* ---- 地図 ---- */
const map = L.map('map', { zoomControl:true, minZoom:14, maxBoundsViscosity:0.85 }).setView(CENTER, 16);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom:19,
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);
map.setMaxBounds([
  [VIEW_BOUNDS[0][0]-0.005, VIEW_BOUNDS[0][1]-0.006],
  [VIEW_BOUNDS[1][0]+0.005, VIEW_BOUNDS[1][1]+0.006]
]);if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(
    function(pos){ map.setView([pos.coords.latitude, pos.coords.longitude], 18); },
    function(){ map.setView(CENTER, 16); },
    { enableHighAccuracy:true, timeout:6000, maximumAge:60000 }
  );
} else {
  map.setView(CENTER, 16);
}
map.on('click', function(e){
  if (!isAdmin || !placingType) return;
  openAddForm(placingType, e.latlng.lat, e.latlng.lng);
  placingType = null;
  document.getElementById('placeHint').style.display = 'none';
});

/* ---- Firebase リアルタイム同期 ---- */
TYPES.forEach(function(type){
  onValue(ref(db, type), function(snap){
    data[type] = snap.val() || {};
    renderMarkers(type);
    if (currentTab === type) renderTab();
  });
});

function saveItem(type, item){
  return set(ref(db, type + '/' + item.id), item);
}
function deleteItemDB(type, id){
  return remove(ref(db, type + '/' + id));
}

/* ---- ユーティリティ ---- */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){ return (s||'').replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'\'',"'":'&#39;'}[c]; }); }
function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(function(){ t.classList.remove('show'); }, 2500); }
function timeAgo(ts){
  var s=Math.floor((Date.now()-ts)/1000);
  if(s<60) return s+'秒前'; if(s<3600) return Math.floor(s/60)+'分前'; return Math.floor(s/3600)+'時間前';
}
function formatDateJp(s){
  if(!s) return '日付未設定';
  var d=new Date(s+'T00:00:00'); if(isNaN(d)) return s;
  return (d.getMonth()+1)+'/'+(d.getDate())+'（'+'日月火水木金土'[d.getDay()]+'）';
}
function todayStr(){
  var d=new Date();
  return d.getFullYear()+'-'+(('0'+(d.getMonth()+1)).slice(-2))+'-'+(('0'+d.getDate()).slice(-2));
}
function labelOf(t){ return t==='dashi'?'山車':(t==='toilet'?'トイレ':'イベント'); }

var ICONS = { dashi:'🏮', toilet:'🚻', venue:'🎪' };
var iconCache = {};
function makeIcon(type, name, iconKey, isLive){
  var key = type+'|'+name+'|'+(iconKey||'')+'|'+(isLive?'live':'');
  if(!iconCache[key]){
    var html;
    var liveBadge = isLive ? '<div class="marker-live-badge"><span class="live-dot"></span>LIVE</div>' : '';
    if(type==='dashi' && iconKey && DASHI_ICONS[iconKey]){
      var src = DASHI_ICONS[iconKey].src;
      html = '<div class="pin-img"><img src="'+src+'" width="34" height="44" style="display:block;">'+liveBadge+'<div class="label" style="margin-top:1px;">'+esc(name)+'</div></div>';
      iconCache[key] = L.divIcon({html:html, iconSize:[34,68], iconAnchor:[17,64], className:''});
    } else {
      html = '<div class="pin '+type+'"><div class="bubble"><span>'+ICONS[type]+'</span></div>'+liveBadge+'<div class="label">'+esc(name)+'</div></div>';
      iconCache[key] = L.divIcon({html:html, iconSize:[34,62], iconAnchor:[17,58], className:''});
    }
  }
  return iconCache[key];
}
function renderMarkers(type){
  var ids = {};
  Object.keys(data[type]).forEach(function(id){ ids[id]=true; });
  Object.keys(markers[type]).forEach(function(id){
    if(!ids[id]){ map.removeLayer(markers[type][id]); delete markers[type][id]; }
  });
  Object.values(data[type]).forEach(function(item){
    if(!item||!item.lat||!item.lng) return;
    var isLive = type==='dashi' && !!item.live;
    if(markers[type][item.id]){
      var mk=markers[type][item.id];
      var ll=mk.getLatLng();
      if(ll.lat!==item.lat||ll.lng!==item.lng) mk.setLatLng([item.lat,item.lng]);
      if(mk._n!==item.name||mk._ik!==item.iconKey||mk._live!==isLive){
        mk.setIcon(makeIcon(type,item.name,item.iconKey,isLive));
        mk._n=item.name; mk._ik=item.iconKey; mk._live=isLive;
      }
    } else {
      var m=L.marker([item.lat,item.lng],{icon:makeIcon(type,item.name,item.iconKey,isLive)}).addTo(map);
      m._n=item.name; m._live=isLive;
      (function(t,id){ m.on('click',function(){ showItemPopup(t, id); }); })(type,item.id);
      markers[type][item.id]=m;
    }
  });
  // LIVE中の山車数をヘッダーに表示
  if(type==='dashi') updateLiveStatus();
}

function showItemPopup(type, id){
  var item = data[type][id];
  if(!item) return;
  map.setView([item.lat, item.lng], Math.max(map.getZoom(), 17), {animate:true});

  var iconHtml;
  if(type==='dashi'&&item.iconKey&&DASHI_ICONS[item.iconKey]){
    iconHtml='<img src="'+DASHI_ICONS[item.iconKey].src+'" width="36" height="47" style="vertical-align:middle;margin-right:6px;">';
  } else {
    iconHtml='<span style="font-size:22px;margin-right:6px;">'+ICONS[type]+'</span>';
  }

  var body='';
  if(item.note) body+='<div class="popup-note">'+esc(item.note)+'</div>';
  if(type==='dashi'&&item.live){
    body+='<div class="popup-live"><span class="live-dot" style="width:8px;height:8px;"></span> リアルタイム配信中</div>';
  }
  if(type==='toilet'){
    var m2=(item.male!==null&&item.male!==undefined)?item.male:'―';
    var f2=(item.female!==null&&item.female!==undefined)?item.female:'―';
    var s2=(item.shared!==null&&item.shared!==undefined)?item.shared:'―';
    body+='<div class="toilet-counts" style="margin-top:6px;">'
      +'<span>&#x1F6B9; 男性 <strong>'+m2+'</strong> 基</span>'
      +'<span>&#x1F6BA; 女性 <strong>'+f2+'</strong> 基</span>'
      +'<span>&#x1F6BB; 共同 <strong>'+s2+'</strong> 基</span>'
      +'</div>';
  }
  if(type==='venue'&&item.schedule&&item.schedule.length){
    body+=renderSchedGrouped(item.schedule);
  }

  var adminBtns='';
  if(isAdmin){
    adminBtns='<div style="display:-webkit-flex;display:flex;gap:6px;margin-top:10px;-webkit-flex-wrap:wrap;flex-wrap:wrap;">'
      +'<button class="btn btn-outline" onclick="closeItemPopup();openEditForm(\''+type+'\',\''+id+'\')">編集</button>';
    if(type==='dashi'){
      if(item.live){
        adminBtns+='<button class="btn btn-live" onclick="closeItemPopup();stopLive()">GPS停止</button>';
      } else {
        adminBtns+='<button class="btn btn-outline" onclick="closeItemPopup();startLive(\''+id+'\')">GPSで自動更新</button>';
      }
    }
    adminBtns+='<button class="btn btn-danger" onclick="closeItemPopup();deleteItem(\''+type+'\',\''+id+'\')">削除</button>'
      +'</div>';
  }

  var titleHtml = iconHtml+esc(item.name);
  var contentHtml = body+adminBtns;

  // PC（721px以上）: Leafletネイティブポップアップをマーカー近くに表示
  if(window.innerWidth > 720){
    var popup = L.popup({
      maxWidth: 300,
      className: 'chamatsuri-popup',
      closeButton: true,
      autoClose: true,
      closeOnClick: false
    })
    .setLatLng([item.lat, item.lng])
    .setContent(
      '<div class="lp-title">'+titleHtml+'</div>'
      +'<div class="lp-body">'+contentHtml+'</div>'
    )
    .openOn(map);
  } else {
    // スマホ: 下部シート
    document.getElementById('itemPopupTitle').innerHTML=titleHtml;
    document.getElementById('itemPopupBody').innerHTML=contentHtml;
    document.getElementById('itemPopup').style.display='flex';
  }
}
function closeItemPopup(){
  document.getElementById('itemPopup').style.display='none';
  map.closePopup();
}
window.closeItemPopup=closeItemPopup;

function updateLiveStatus(){
  var liveCount = Object.values(data.dashi).filter(function(i){ return i&&i.live; }).length;
  var el = document.getElementById('liveStatus');
  if(!el) return;
  if(liveCount > 0){
    el.innerHTML = '<span class="live-dot" style="width:7px;height:7px;display:inline-block;margin-right:4px;"></span>山車 '+liveCount+'台 巡行中';

function switchTab(t){
  currentTab=t;
  document.querySelectorAll('.tab').forEach(function(el){ el.classList.toggle('active',el.dataset.tab===t); });
  renderTab();
}
function togglePanel(){ document.getElementById('panel').classList.toggle('open'); }
function openPanelMobile(){ document.getElementById('panel').classList.add('open'); }
function highlightCard(id){
  setTimeout(function(){ var el=document.getElementById('card-'+id); if(el) el.scrollIntoView({behavior:'smooth',block:'center'}); },80);
}

function renderTab(){
  var c=document.getElementById('tabContent');
  var html='';
  if(isAdmin){
    html+='<div class="hint">'+adminHint(currentTab)+'</div>';
    html+='<button class="btn btn-primary" style="width:100%;margin-bottom:10px;" onclick="startPlacing(\''+currentTab+'\')">+ '+labelOf(currentTab)+'を地図に追加</button>';
  }
  var list=Object.values(data[currentTab]||{}).filter(Boolean);
  if(!list.length){
    html+='<div id="emptyState">まだ'+labelOf(currentTab)+'の登録がありません。'+(isAdmin?'上のボタンから追加できます。':'管理者が登録すると表示されます。')+'</div>';
  } else {
    // orderフィールドで並び替え、なければ登録順
    list.sort(function(a,b){
      if(a.order!=null&&b.order!=null) return a.order-b.order;
      if(a.order!=null) return -1;
      if(b.order!=null) return 1;
      return (a.name||'').localeCompare(b.name||'','ja');
    });
    if(isAdmin&&(currentTab==='dashi'||currentTab==='toilet'||currentTab==='venue')){
      html+='<div class="sort-hint">&#x2195; ドラッグで並び替えできます</div>';
    }
    html+='<div id="cardList">';
    list.forEach(function(item){ html+=renderCard(currentTab,item); });
    html+='</div>';
  }
  c.innerHTML=html;
  if(isAdmin) initDragSort();
}

function adminHint(t){
  if(t==='dashi') return '山車を追加後、「GPSで自動更新」をONにすると位置がリアルタイムで全員に反映されます。';
  if(t==='toilet') return 'トイレの位置を登録します。仮設トイレの新設・撤去時も更新してください。';
  return 'イベントを登録し、タイムスケジュールを設定できます。';
}

function renderCard(type, item){
  if(!item) return '';
  var updated=item.updatedAt?timeAgo(item.updatedAt):null;
  // 山車はカスタムアイコン画像、それ以外は絵文字
  var iconHtml;
  if(type==='dashi'&&item.iconKey&&DASHI_ICONS[item.iconKey]){
    iconHtml='<img src="'+DASHI_ICONS[item.iconKey].src+'" width="32" height="32" style="vertical-align:middle;border-radius:4px;margin-right:4px;">';
  } else {
    iconHtml=ICONS[type]+' ';
  }
  var dragHandle = (isAdmin) ? '<span class="drag-handle" title="ドラッグで並び替え">&#x2195;</span>' : '';
  var inner='<div class="crow">'+dragHandle+'<h3>'+iconHtml+esc(item.name)+'</h3>';
  if(type==='dashi'&&item.live) inner+='<span class="live-badge"><span class="live-dot"></span>LIVE</span>';
  inner+='</div>';
  if(type!=='toilet'&&updated) inner+='<div class="meta">最終更新: '+updated+'</div>';
  if(item.note) inner+='<div class="meta">'+esc(item.note)+'</div>';
  if(type==='toilet'){
    var m=(item.male!==null&&item.male!==undefined)?item.male:'―';
    var f=(item.female!==null&&item.female!==undefined)?item.female:'―';
    var s=(item.shared!==null&&item.shared!==undefined)?item.shared:'―';
    inner+='<div class="toilet-counts">'
      +'<span>&#x1F6B9; 男性 <strong>'+m+'</strong> 基</span>'
      +'<span>&#x1F6BA; 女性 <strong>'+f+'</strong> 基</span>'
      +'<span>&#x1F6BB; 共同 <strong>'+s+'</strong> 基</span>'
      +'</div>';
  }
  if(type==='venue'&&item.schedule&&item.schedule.length) inner+=renderSchedGrouped(item.schedule);
  if(isAdmin){
    inner+='<div class="crow" style="margin-top:8px;gap:6px;">';
    inner+='<button class="btn btn-outline" onclick="event.stopPropagation();openEditForm(\''+type+'\',\''+item.id+'\')">編集</button>';
    if(type==='dashi'){
      if(item.live){
        inner+='<button class="btn btn-live" onclick="event.stopPropagation();stopLive()">GPS停止</button>';
      } else {
        inner+='<button class="btn btn-outline" onclick="event.stopPropagation();startLive(\''+item.id+'\')">GPSで自動更新</button>';
      }
    }
    inner+='<button class="btn btn-danger" onclick="event.stopPropagation();deleteItem(\''+type+'\',\''+item.id+'\')">削除</button>';
    inner+='</div>';
  }
  return '<div class="card" id="card-'+item.id+'" data-id="'+item.id+'" onclick="focusItem(\''+type+'\',\''+item.id+'\')" style="cursor:pointer;">'+inner+'</div>';
}

function renderSchedGrouped(schedule){
  var byDate={};
  schedule.forEach(function(s){ var k=s.date||''; if(!byDate[k]) byDate[k]=[]; byDate[k].push(s); });
  var html='<div class="sched">';
  Object.keys(byDate).sort().forEach(function(date){
    var items=byDate[date].slice().sort(function(a,b){ return (a.time||'').localeCompare(b.time||''); });
    html+='<div class="sched-day"><span class="day-h">'+formatDateJp(date)+'</span><ul style="list-style:none;margin:2px 0 0;padding:0;">';
    items.forEach(function(s){ html+='<li><span class="t">'+esc(s.time||'--:--')+'</span><span>'+esc(s.title||'')+'</span></li>'; });
    html+='</ul></div>';
  });
  return html+'</div>';
}

function focusItem(type, id){
  var item=data[type][id];
  if(!item) return;
  map.setView([item.lat,item.lng],19,{animate:true});
  // スマホではパネルを閉じて地図を見せる
  if(window.innerWidth<=720){
    document.getElementById('panel').classList.remove('open');
  }
}

function submitAddForm(type, lat, lng){
  var nameEl=document.getElementById('addName');
  var name=nameEl?nameEl.value.trim():'';
  if(!name){alert('名前を入力してください。');return;}
  var noteEl=document.getElementById('addNote');
  var note=noteEl?noteEl.value.trim():'';
  var item={id:uid(),name:name,note:note,lat:lat,lng:lng,updatedAt:Date.now()};
  if(type==='dashi'){
    var ikEl=document.getElementById('addIconKey');
    item.iconKey = (ikEl&&ikEl.value) ? ikEl.value : '';
  }
  if(type==='toilet'){
    var mEl=document.getElementById('addMale');
    var fEl=document.getElementById('addFemale');
    var sEl=document.getElementById('addShared');
    item.male   = (mEl&&mEl.value!=='') ? parseInt(mEl.value,10) : null;
    item.female = (fEl&&fEl.value!=='') ? parseInt(fEl.value,10) : null;
    item.shared = (sEl&&sEl.value!=='') ? parseInt(sEl.value,10) : null;

  if(type==='venue'){

    document.querySelectorAll('.schedDayGroup').forEach(function(g){

      g.querySelectorAll('.schedRow').forEach(function(r){

        if(date&&(time||title)) sched.push({date:date,time:time,title:title});

    toast(labelOf(type)+'を登録しました');

    var sched=[];
    document.querySelectorAll('.schedDayGroup').forEach(function(g){
      var date=g.querySelector('.sched-day-date').value;
      g.querySelectorAll('.schedRow').forEach(function(r){
        var time=r.querySelector('.sched-time').value;
        var title=r.querySelector('.sched-title').value.trim();
        if(date&&(time||title)) sched.push({date:date,time:time,title:title});
      });
    });
    item.schedule=sched;
  }
  saveItem(type, item).then(function(){
    toast(labelOf(type)+'を更新しました');
    cancelAddForm();
  }).catch(function(){ alert('更新に失敗しました。通信環境をご確認ください。'); });
}

/* ---- GPS配信 ---- */
var wakeLock = null;

async function acquireWakeLock(){
  if('wakeLock' in navigator){
    try{
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', function(){
        // 画面ロック等で解放された場合、ページが見えていれば再取得
        if(liveWatchId !== null && !document.hidden){
          acquireWakeLock();
        }
      });
    } catch(e){
      // wakeLock非対応でも続行
    }
  }
}

function releaseWakeLock(){
  if(wakeLock){ wakeLock.release(); wakeLock=null; }
}

// ページが再び表示されたとき（画面ロック解除・タブ切替後）にwakeLockを再取得
document.addEventListener('visibilitychange', function(){
  if(!document.hidden && liveWatchId !== null){
    acquireWakeLock();
  }
});

function startLive(id){
  if(!navigator.geolocation){alert('このブラウザは位置情報に対応していません。');return;}
  if(liveWatchId!==null) stopLive();
  liveDashiId=id;
  liveWatchId=navigator.geolocation.watchPosition(function(pos){
    var now=Date.now();
    if(now-lastLiveSend<8000) return;
    lastLiveSend=now;
    var item=data.dashi[id]; if(!item) return;
    var updated=Object.assign({},item,{lat:pos.coords.latitude,lng:pos.coords.longitude,updatedAt:now,live:true});
    saveItem('dashi',updated);
  }, function(err){ alert('位置情報エラー: '+err.message); },
  {enableHighAccuracy:true,maximumAge:5000,timeout:15000});
  var item=data.dashi[id];
  if(item) saveItem('dashi',Object.assign({},item,{live:true}));
  acquireWakeLock();
  toast('GPS配信を開始しました');
}

function stopLive(){
  if(liveWatchId!==null){navigator.geolocation.clearWatch(liveWatchId);liveWatchId=null;}
  if(liveDashiId){
    var item=data.dashi[liveDashiId];
    if(item) saveItem('dashi',Object.assign({},item,{live:false}));
  }
  liveDashiId=null;
  releaseWakeLock();
  toast('GPS配信を停止しました');
}

function locateMe(){
  if(!navigator.geolocation){ toast('位置情報が使えません'); return; }
  var btn=document.getElementById('locateBtn');
  btn.classList.add('locating');
  btn.textContent='⏳';
  navigator.geolocation.getCurrentPosition(function(pos){
    map.setView([pos.coords.latitude, pos.coords.longitude], 18, {animate:true});
    btn.classList.remove('locating');
    btn.textContent='📍';
  }, function(){
    toast('現在地を取得できませんでした');
    btn.classList.remove('locating');
    btn.textContent='📍';
  }, {enableHighAccuracy:true, timeout:8000, maximumAge:10000});
}
window.locateMe=locateMe; /* ---- ドラッグ&ドロップ並び替え（PC・スマホ両対応） ---- */
var dragSrc = null;

function initDragSort(){
  var list = document.getElementById('cardList');
  if(!list) return;
  var cards = list.querySelectorAll('.card');
  cards.forEach(function(card){
    // PC: drag
    card.setAttribute('draggable','true');
    card.addEventListener('dragstart', function(e){
      dragSrc = card;
      setTimeout(function(){ card.classList.add('dragging'); }, 0);
      e.dataTransfer.effectAllowed = 'move';
    });
    card.addEventListener('dragend', function(){
      card.classList.remove('dragging');
      list.querySelectorAll('.card').forEach(function(c){ c.classList.remove('drag-over'); });
      saveSortOrder();
    });
    card.addEventListener('dragover', function(e){
      e.preventDefault();
      if(card===dragSrc) return;
      list.querySelectorAll('.card').forEach(function(c){ c.classList.remove('drag-over'); });
      card.classList.add('drag-over');
      var rect = card.getBoundingClientRect();
      var mid = rect.top + rect.height/2;
      if(e.clientY < mid){
        list.insertBefore(dragSrc, card);
      } else {
        list.insertBefore(dragSrc, card.nextSibling);
      }
    });
    card.addEventListener('drop', function(e){ e.preventDefault(); });

    // スマホ: touch
    var touchStartY = 0;
    card.addEventListener('touchstart', function(e){
      if(!e.target.closest('.drag-handle')) return;
      e.stopPropagation();
      dragSrc = card;
      touchStartY = e.touches[0].clientY;
      card.classList.add('dragging');
    }, {passive:false});
    card.addEventListener('touchmove', function(e){
      if(!dragSrc||dragSrc!==card) return;
      e.preventDefault();
      var touch = e.touches[0];
      var el = document.elementFromPoint(touch.clientX, touch.clientY);
      var target = el ? el.closest('.card') : null;
      if(target && target!==dragSrc){
        list.querySelectorAll('.card').forEach(function(c){ c.classList.remove('drag-over'); });
        target.classList.add('drag-over');
        var rect = target.getBoundingClientRect();
        if(touch.clientY < rect.top + rect.height/2){
          list.insertBefore(dragSrc, target);
        } else {
          list.insertBefore(dragSrc, target.nextSibling);
        }
      }
    }, {passive:false});
    card.addEventListener('touchend', function(){
      if(!dragSrc||dragSrc!==card) return;
      card.classList.remove('dragging');
      list.querySelectorAll('.card').forEach(function(c){ c.classList.remove('drag-over'); });
      dragSrc = null;
      saveSortOrder();
    });
  });
}

function saveSortOrder(){
  var list = document.getElementById('cardList');
  if(!list) return;
  var cards = list.querySelectorAll('.card');
  var saves = [];
  cards.forEach(function(card, idx){
    var id = card.dataset.id;
    var item = data[currentTab][id];
    if(item && item.order !== idx){
      item.order = idx;
      saves.push(saveItem(currentTab, item));
    }
  });
  Promise.all(saves).catch(function(){ toast('並び順の保存に失敗しました'); });
}

/* ---- 管理者 ---- */
function onAdminBtn(){
  if(isAdmin){
    if(confirm('ログアウトしますか？')){
      isAdmin=false; stopLive();
      document.getElementById('adminBtn').textContent='管理者ログイン';
      document.getElementById('adminBtn').classList.remove('on');
      renderTab();
    }
  } else {
    document.getElementById('loginOverlay').style.display='flex';
    document.getElementById('loginPin').value='';
    document.getElementById('loginErr').textContent='';
    setTimeout(function(){ document.getElementById('loginPin').focus(); },50);
  }
}
function closeLogin(){ document.getElementById('loginOverlay').style.display='none'; }
function tryLogin(){
  if(document.getElementById('loginPin').value===ADMIN_PASSCODE){
    isAdmin=true;
    document.getElementById('adminBtn').textContent='ログアウト';
    document.getElementById('adminBtn').classList.add('on');
    closeLogin(); renderTab();
  } else {
    document.getElementById('loginErr').textContent='合言葉が違います。';
  }
}
document.getElementById('loginPin').addEventListener('keydown',function(e){ if(e.key==='Enter') tryLogin(); });
